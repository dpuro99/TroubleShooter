name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Set VITE_BASE to '/<repo-name>/' so assets resolve for project pages
    env:
      VITE_BASE: '/${{ github.event.repository.name }}/'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Prefer a personal access token (PAT) stored in repo secret `GH_PAGES_PAT`.
          # Create a PAT with `repo` (or `public_repo` for public repos) and `workflow` scopes
          # and add it to Settings → Secrets → Actions as `GH_PAGES_PAT`.
          github_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./dist
      - name: Ensure Pages is published from gh-pages
        uses: actions/github-script@v6
        with:
          # Use the same PAT for API calls that require elevated privileges.
          github-token: ${{ secrets.GH_PAGES_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.repos.createPagesSite({
              owner,
              repo,
              source: { branch: 'gh-pages', path: '/' }
            });
